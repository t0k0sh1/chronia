name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-slim
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      # add Socket Firewall to the runner environment
      - uses: socketdev/action@v1
        with:
          mode: firewall
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - run: sfw pnpm install

      - name: Lint
        if: matrix.node-version == '24.x'
        run: pnpm lint

      - run: pnpm run build

      # Vitest 5 requires Node.js 22.12+, so Node 18.x/20.x only verify that
      # the built package loads and works (the library still supports Node >=18).
      - name: Smoke test built package
        if: contains(fromJSON('["18.x", "20.x"]'), matrix.node-version)
        run: |
          node -e "const c = require('./dist/index.cjs'); const i = require('./dist/i18n/index.cjs'); if (c.addDays(new Date(2024, 0, 1), 1).getDate() !== 2 || !i.enUS) process.exit(1)"
          node --input-type=module -e "import { addDays } from './dist/index.js'; import { enUS } from './dist/i18n/index.js'; if (addDays(new Date(2024, 0, 1), 1).getDate() !== 2 || !enUS) process.exit(1)"

      - name: Test
        if: matrix.node-version == '22.x'
        run: pnpm vitest run

      - name: Test with coverage
        if: matrix.node-version == '24.x'
        run: pnpm vitest run --coverage

      - name: Upload coverage reports to Codecov
        if: matrix.node-version == '24.x' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7.0.0
        with:
          files: ./coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
